#
# Cluster-wide kill switch: MCPContentFilterPolicyConfig ConfigMap.
#
# The gateway reads this ConfigMap at startup (and hot-reloads it via
# the Envoy AI Gateway controller). Flipping `globalDisable: true`
# short-circuits EVERY MCPContentFilter attached to any backend:
#
#   - No filter URL is contacted (request OR response scope).
#   - X-Content-Filter-Status: disabled is set on the response.
#   - mcp_filter_status_total{status="disabled"} increments.
#   - The ORIGINAL body is forwarded unchanged.
#
# The knob is intended for incident response — one lever to back out
# of a filter-related regression (LLM outage, bad policy deploy,
# unexpected latency spike) without editing every MCPRoute in the
# fleet. Once the root cause is fixed, flip it back to `false` and
# the fleet resumes filtering on the next reconcile.
#
# Complementary kill switches:
#   - Per-backend: `enabled: false` on the MCPContentFilter spec.
#   - Per-environment: shadow mode with `shadowSampleRatePermille: 0`
#     (valid in shadow mode only; enforce ignores the sampling knob).
#
# ConfigMap shape:
#   key  = "policy.json"
#   value = JSON-encoded filterapi.MCPContentFilterPolicyConfig
#           (struct in internal/filterapi/mcp_content_filter_policy.go)
#
# After the gateway slimming refactor the struct carries ONLY
# `globalDisable`. PII / cache / breaker / backend-enable / evalHeader
# / wire-limit knobs moved to the external content-filter service's
# own configuration, which is per-service and independently reloaded.
# Per-route policy selection lives on MCPContentFilter.policies in each
# MCPRoute spec, not here.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-content-filter-policy
  # Namespace must match whatever the gateway is configured to watch
  # via --content-filter-policy-configmap=<namespace>/<name>. By
  # convention this lives in the same namespace as the gateway pod.
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: mcp-content-filter-policy
    app.kubernetes.io/part-of: ai-gateway
data:
  policy.json: |
    {
      "globalDisable": false
    }
