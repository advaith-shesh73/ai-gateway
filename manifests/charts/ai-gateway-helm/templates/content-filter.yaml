{{- if .Values.contentFilter.enabled }}
# ---------------------------------------------------------------------------
# Optional out-of-process MCP content filter. Rendered only when
# contentFilter.enabled=true so that existing installs are unaffected.
# The service exposes the policy contract documented in
# internal/mcpproxy/contentfilter.go and is reachable from the gateway via
# an HTTP MCPRoute backend.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-gateway-helm.contentFilter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway-helm.contentFilter.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Rendered from .Values.contentFilter.config by the ai-gateway-helm chart.
    llm:
      endpoint: {{ .Values.contentFilter.config.llm.endpoint | quote }}
      model: {{ .Values.contentFilter.config.llm.model | quote }}
      timeout: {{ .Values.contentFilter.config.llm.timeout | quote }}
    ticketHeader: {{ .Values.contentFilter.config.ticketHeader | quote }}
    filteredTools:
      {{- range .Values.contentFilter.config.filteredTools }}
      - {{ . | quote }}
      {{- end }}
---
{{- if .Values.contentFilter.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-gateway-helm.contentFilter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway-helm.contentFilter.labels" . | nindent 4 }}
  {{- with .Values.contentFilter.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway-helm.contentFilter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway-helm.contentFilter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.contentFilter.service.type }}
  selector:
    {{- include "ai-gateway-helm.contentFilter.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      appProtocol: http
      port: {{ .Values.contentFilter.service.port }}
      targetPort: {{ default .Values.contentFilter.containerPort .Values.contentFilter.service.targetPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway-helm.contentFilter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway-helm.contentFilter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.contentFilter.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-gateway-helm.contentFilter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.contentFilter.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ai-gateway-helm.contentFilter.selectorLabels" . | nindent 8 }}
    spec:
      {{- with (include "ai-gateway-helm.contentFilter.imagePullSecrets" .) }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai-gateway-helm.contentFilter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.contentFilter.podSecurityContext | nindent 8 }}
      containers:
        - name: content-filter
          securityContext:
            {{- toYaml .Values.contentFilter.securityContext | nindent 12 }}
          image: "{{ .Values.contentFilter.image.repository }}:{{ .Values.contentFilter.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.contentFilter.imagePullPolicy }}
          args:
            - --config=/etc/content-filter/config.yaml
            - --addr=:{{ .Values.contentFilter.containerPort }}
            - --logLevel={{ .Values.contentFilter.logLevel }}
          ports:
            - name: http
              containerPort: {{ .Values.contentFilter.containerPort }}
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if and .Values.contentFilter.config.llm.apiKey.secretName .Values.contentFilter.config.llm.apiKey.secretKey }}
            - name: CONTENT_FILTER_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.contentFilter.config.llm.apiKey.secretName | quote }}
                  key: {{ .Values.contentFilter.config.llm.apiKey.secretKey | quote }}
            {{- end }}
            {{- with .Values.contentFilter.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.contentFilter.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/content-filter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-gateway-helm.contentFilter.fullname" . }}
      {{- with .Values.contentFilter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentFilter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentFilter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
