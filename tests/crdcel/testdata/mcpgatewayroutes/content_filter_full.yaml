apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: MCPRoute
metadata:
  name: content-filter-full
  namespace: default
spec:
  parentRefs:
    - name: some-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  backendRefs:
    - name: mcp-service
      kind: Service
      port: 80
      path: /mcp
      toolSelector:
        include:
          - run
      contentFilter:
        url: https://content-filter.default.svc.cluster.local:8443/filter
        scopes:
          - Request
          - Response
        timeoutSeconds: 30
        failurePolicy: PassThrough
        forwardHeaders:
          - x-request-id
          - x-tenant-id
          - x-ticket-id
